<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page not found · Anirudh Parupalli</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    body { background:#05060f; color:#f1f5f9; font-family:'Inter',system-ui,sans-serif; }
    .display { font-family:'Space Grotesk',sans-serif; letter-spacing:-0.02em; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center px-6">
  <div class="fixed inset-0 -z-10 pointer-events-none">
    <div class="absolute top-1/4 left-1/4 w-[600px] h-[600px] bg-violet-600/20 rounded-full blur-[120px]"></div>
    <div class="absolute bottom-1/4 right-1/4 w-[500px] h-[500px] bg-cyan-500/15 rounded-full blur-[120px]"></div>
  </div>
  <div class="text-center max-w-lg">
    <div class="display text-8xl font-bold mb-6 bg-gradient-to-r from-cyan-400 via-violet-400 to-violet-500 bg-clip-text text-transparent">404</div>
    <h1 class="display text-3xl font-bold mb-4">Page not found</h1>
    <p class="text-slate-400 mb-8">The page you're looking for doesn't exist. Let's get you back to the portfolio.</p>
    <a href="/" class="inline-flex items-center gap-2 bg-gradient-to-r from-cyan-500 to-violet-500 text-slate-900 font-semibold px-6 py-3 rounded-full hover:shadow-xl transition-all">
      ← Back to home
    </a>
  </div>
</body>
</html>
